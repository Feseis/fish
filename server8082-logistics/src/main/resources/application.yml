server:
  port: 8082

spring:
  application:
    name: logistics-server
  config:
    import: optional:file:./a_run_env/logistics.env[.properties]
  datasource:
    url: ${LOGISTICS_DB_URL}
    username: ${LOGISTICS_DB_USERNAME}
    password: ${LOGISTICS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logistics:
  amap:
    base-url: https://restapi.amap.com
    key: ${AMAP_WEB_KEY}
  auth:
    base-url: ${AUTH_SERVICE_URL}
  payment:
    base-url: ${PAYMENT_SERVICE_URL}
  routing:
    # 启动时是否跑路由配置校验；数据量大或频繁启动时置 false
    validate-on-startup: true
