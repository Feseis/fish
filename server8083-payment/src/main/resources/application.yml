server:
  port: 8083

spring:
  application:
    name: payment-server
  config:
    import: optional:file:./a_run_env/payment.env[.properties]
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8

mybatis:
  configuration:
    map-underscore-to-camel-case: true

payment:
  alipay:
    # 沙箱开关。false 时 payChannel=2 直接返回「未接入」，模拟渠道不受影响
    enabled: ${ALIPAY_ENABLED:false}
    app-id: ${ALIPAY_APP_ID:}
    gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    # 应用私钥（PKCS8）与支付宝公钥，两者不能混用
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    # 留空则不下发 notify_url，订单只靠主动查单入账
    notify-url: ${ALIPAY_NOTIFY_URL:}
