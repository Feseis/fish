server:
  port: 8084

spring:
  application:
    name: sms-server
  config:
    import: optional:file:./a_run_env/sms.env[.properties]
  datasource:
    url: ${SMS_DB_URL}
    username: ${SMS_DB_USERNAME}
    password: ${SMS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8

mybatis:
  configuration:
    map-underscore-to-camel-case: true

sms:
  pbox:
    base-url: ${PBOX_BASE_URL}
    sender-phone: ${PBOX_SENDER_PHONE}
    api-code: ${PBOX_API_CODE}
