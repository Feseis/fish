server:
  port: 8081

spring:
  application:
    name: auth-server
  config:
    import: optional:file:./a_run_env/auth.env[.properties]
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

auth:
  token:
    access-ttl: 2h
    refresh-ttl: 7d
  cookie:
    secure: false
  sms:
    code-ttl: 5m
    resend-interval: 60s
    pbox:
      base-url: ${PBOX_BASE_URL}
      sender-phone: ${PBOX_SENDER_PHONE}
      api-code: ${PBOX_API_CODE}
